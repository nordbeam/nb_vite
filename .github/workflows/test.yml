name: Test

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/PUBLISHING.md"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - elixir: "1.15"
            otp: "25"
          - elixir: "1.20"
            otp: "29"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: "26"
          cache: true
          run-install: true

      - name: Cache Elixir dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-mix-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Build JavaScript plugin
        run: vp run build

      - name: Verify plugin was built
        run: |
          if [ ! -f "priv/nb_vite/dist/index.js" ]; then
            echo "Error: Plugin build failed - index.js not found"
            exit 1
          fi

      - name: Check formatting
        run: mix format --check-formatted
        if: matrix.elixir == '1.20' && matrix.otp == '29'

      - name: Run tests
        run: mix test

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Check for security vulnerabilities
        run: mix deps.audit
        continue-on-error: true
