name: Publish to Hex.pm

on:
  push:
    tags:
      - 'v*.*.*'  # Only run on version tags like v0.1.0

permissions:
  contents: write  # Required for creating releases

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20'
        otp-version: '29'
        
    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@v1.18.0
      with:
        node-version: '26'
        cache: true
        run-install: true
        
    - name: Cache Elixir dependencies
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-
          
    - name: Install Elixir dependencies
      run: mix deps.get
      
    - name: Build JavaScript plugin
      run: vp run build
        
    - name: Verify plugin was built
      run: |
        if [ ! -f "priv/nb_vite/dist/index.js" ]; then
          echo "Error: Plugin build failed - index.js not found"
          exit 1
        fi
        echo "Plugin built successfully"
        
    - name: Run tests
      run: mix test
      
    - name: Check formatting
      run: mix format --check-formatted
      
    - name: Verify tag matches version
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        MIX_VERSION=$(grep '@version' mix.exs | head -n1 | cut -d'"' -f2)
        if [ "$TAG_VERSION" != "$MIX_VERSION" ]; then
          echo "Error: Tag version ($TAG_VERSION) does not match mix.exs version ($MIX_VERSION)"
          exit 1
        fi
        echo "Version check passed: $TAG_VERSION"
        
    - name: Publish to Hex.pm
      env:
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      run: |
        mix hex.publish --yes
        
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          --repo "${{ github.repository }}" \
          --title "Release ${{ github.ref_name }}" \
          --notes "NbVite ${{ github.ref_name }} has been released!
        
        View on Hex.pm: https://hex.pm/packages/nb_vite
        
        See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
