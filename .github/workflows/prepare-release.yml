name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.1)'
        required: true
        type: string

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20'
        otp-version: '29'
        
    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@v1.18.0
      with:
        node-version: '26'
        cache: true
        run-install: true
        
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
    - name: Update version in mix.exs
      run: |
        sed -i 's/@version ".*"/@version "${{ inputs.version }}"/' mix.exs
        
    - name: Update version in README
      run: |
        sed -i 's/{:nb_vite, "~> [0-9.]*"}/{:nb_vite, "~> ${{ inputs.version }}"}/' README.md
        
    - name: Install dependencies
      run: mix deps.get

    - name: Build JavaScript plugin
      run: vp run build
        
    - name: Run tests
      run: mix test
      
    - name: Update CHANGELOG
      run: |
        DATE=$(date +%Y-%m-%d)
        sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n## [${{ inputs.version }}] - $DATE/" CHANGELOG.md
        
    - name: Commit changes
      run: |
        git add mix.exs README.md CHANGELOG.md
        git commit -m "Prepare release v${{ inputs.version }}"
        
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: release/v${{ inputs.version }}
        title: "Prepare release v${{ inputs.version }}"
        body: |
          This PR prepares the release of v${{ inputs.version }}.
          
          ## Changes
          - Updated version in mix.exs
          - Updated version in README.md
          - Updated CHANGELOG.md
          
          ## Release Checklist
          - [ ] Review CHANGELOG entries
          - [ ] Verify all tests pass
          - [ ] Ensure documentation is up to date
          - [ ] Merge this PR
          - [ ] The merge will automatically trigger the publish workflow
        labels: release
